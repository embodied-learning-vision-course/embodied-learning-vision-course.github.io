version: '3'

services:
  jekyll:
    image: jekyll/jekyll:4.4.1
    command: jekyll serve --watch --force_polling --verbose --livereload
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll:cached
      - ./vendor/bundle:/usr/local/bundle:cached
    environment:
      - JEKYLL_ENV=development
